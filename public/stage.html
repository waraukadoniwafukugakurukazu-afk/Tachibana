<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ステージ情報｜橘祭</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    /* ステージ1企画ごとのカード */
    .stage-item {
      display: block;
      background: #ffffff;
      border: 2px solid #dbe8df;
      border-radius: 22px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: 0 8px 24px rgba(6, 63, 45, 0.08);
    }

    .stage-item h3 {
      color: #063f2d;
      font-size: 24px;
      margin: 8px 0 12px;
    }

    .stage-item p {
      color: #315127;
      font-size: 17px;
      line-height: 1.7;
      margin: 7px 0;
    }

    .stage-time {
      font-weight: 800;
    }

    .stage-status {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #e8f8d8;
      color: #176b42;
      font-weight: 800;
    }

    .day {
      margin-top: 38px;
    }

    .dayhead h2 {
      color: #063f2d;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .daydate {
      color: #687970;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .stage-item {
        padding: 20px;
        border-radius: 18px;
        margin: 16px 0;
      }

      .stage-item h3 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="shell nav">

    <a class="brand" href="/">橘祭</a>

    <nav class="navlinks">
      <a href="/"><span>HOME</span></a>
      <a href="/stage.html"><span>STAGE</span></a>
      <a href="/shops.html"><span>SHOP</span></a>
    </nav>

  </div>
</header>


<main class="section">
  <div class="shell">

    <div class="kicker" style="color:var(--green)">STAGE</div>
    <h1 class="title">ステージ情報</h1>


    <!-- 全体ステージ予定 -->
    <div class="card">
      <h3>全体ステージ予定</h3>
      <div class="image-slot" id="schedule"></div>
    </div>


    <!-- 検索 -->
    <div class="searchbar">

      <input
        id="q"
        type="search"
        placeholder="ステージ名・時間などで検索"
      >

      <button id="search">検索</button>

    </div>


    <!-- ステージ一覧 -->
    <div id="days"></div>

  </div>
</main>


<footer class="footer">
  <div class="shell">
    <div class="brand">橘祭</div>
  </div>
</footer>


<script src="/app.js"></script>

<script>
(async () => {

  const d = await api("/api/public");

  schedule.innerHTML = imageHTML(
    d.settings.stage_schedule,
    "全体ステージ予定"
  );


  const day = (n, label) => {

    const stages = d.stages.filter(
      s => Number(s.day) === n
    );

    return `
      <section class="day">

        <div class="dayhead">
          <h2>${n}日目</h2>
          <div class="daydate">
            ${esc(label || "")}
          </div>
        </div>

        ${
          stages.length

          ? stages.map(s => `

              <article class="stage-item">

                <h3>${esc(s.name)}</h3>

                <p class="stage-time">
                  🕒 ${esc(s.time)}
                </p>

                <div class="stage-status">
                  ${s.available ? "参加可能" : "参加不可能"}
                </div>

              </article>

            `).join("")

          : `<p class="muted">情報は準備中です。</p>`
        }

      </section>
    `;
  };


  days.innerHTML =
    day(1, d.settings.day1) +
    day(2, d.settings.day2);


  search.onclick = () => {

    searchAndScroll(
      "#q",
      ".stage-item",
      x => x.innerText
    );

  };


  q.addEventListener("keydown", e => {

    if (e.key === "Enter") {
      search.click();
    }

  });

})();
</script>

</body>
</html>
