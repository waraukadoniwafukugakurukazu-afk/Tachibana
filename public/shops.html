<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>出店情報｜橘祭</title>
  <link rel="stylesheet" href="/styles.css">

<style>
.shop-item {
  display: block;
  background: #ffffff;
  border: 2px solid #dbe8df;
  border-radius: 22px;
  padding: 22px;
  margin: 18px 0;
  box-shadow: 0 8px 24px rgba(6, 63, 45, 0.08);
}

.shop-item .kicker {
  color: #9edb38;
  font-weight: 900;
  font-size: 17px;
}

.shop-item h3 {
  color: #063f2d;
  font-size: 24px;
  margin: 10px 0;
}

.shop-item p {
  color: #315127;
  font-size: 17px;
  margin: 8px 0 0;
}
</style>

</head>
</head>

<body class="shop-page">

<header class="header">
  <div class="shell nav">
    <a class="brand" href="/">橘祭</a>

    <nav class="navlinks">
      <a href="/"><span>HOME</span></a>
      <a href="/stage.html"><span>STAGE</span></a>
      <a href="/shops.html"><span>SHOP</span></a>
    </nav>
  </div>
</header>

<main class="section">
  <div class="shell">

    <div class="kicker" style="color:var(--green)">SHOP</div>
    <h1 class="title">出店情報</h1>

    <!-- 学内出店マップ -->
    <div class="card shop-map-card">
      <h3>学内 出店マップ</h3>

      <div id="shopMap" class="shop-map-wrap"></div>
    </div>

    <!-- 検索 -->
    <div class="searchbar">
      <input
        id="q"
        type="search"
        placeholder="出店番号・店名・販売内容で検索"
      >
      <button id="search">検索</button>
    </div>

    <!-- 出店一覧 -->
    <div id="list"></div>

  </div>
</main>

<footer class="footer">
  <div class="shell">
    <div class="brand">橘祭</div>
  </div>
</footer>

<script src="/app.js"></script>

<script>
(async () => {
  const d = await api("/api/public");

  shopMap.innerHTML = imageHTML(
    d.settings.shop_map,
    "出店マップ"
  );

  list.innerHTML = d.shops.length
    ? d.shops.map(s => `
        <article class="card shop-item">
      <div class="kicker">出店番号 ${esc(s.shop_no)}</div>
          <h3>${esc(s.name)}</h3>
          <p>${esc(s.sells)}</p>
        </article>
      `).join("")
    : `<p class="muted">情報は準備中です。</p>`;

  search.onclick = () =>
    searchAndScroll(
      q,
      ".shop-item",
      x => x.innerText
    );

  q.addEventListener("keydown", e => {
    if (e.key === "Enter") search.click();
  });
})();
</script>

</body>
</html>
