<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>橘祭 管理画面</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* ==============================
       橘祭 管理画面専用
    ============================== */

    .admin-page {
      background: #f7f7ef;
      min-height: 100vh;
    }

    .admin-top {
      background: #063f2d;
      color: #fff;
      padding: 20px 0;
    }

    .admin-top-inner {
      width: min(900px, calc(100% - 32px));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .admin-logo {
      font-size: 23px;
      font-weight: 900;
    }

    .admin-top-actions {
      display: flex;
      gap: 8px;
    }

    .admin-top-actions a,
    .admin-top-actions button {
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      background: rgba(255,255,255,.14);
      color: white;
    }

    .admin-container {
      width: min(900px, calc(100% - 28px));
      margin: 30px auto 80px;
    }

    .admin-heading {
      margin-bottom: 28px;
    }

    .admin-heading .kicker {
      color: #18a94b;
      font-size: 14px;
    }

    .admin-heading h1 {
      font-family: inherit;
      letter-spacing: 0;
      line-height: 1.15;
      font-size: clamp(32px, 8vw, 48px);
      margin: 7px 0 10px;
    }

    .admin-heading p {
      color: #687970;
      line-height: 1.7;
      margin: 0;
    }
